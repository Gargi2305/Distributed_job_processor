version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: golang:1.21
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      - REDIS_ADDR=redis:6379
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - redis
    command: ["go", "run", "./cmd/api"]

  worker:
    image: golang:1.21
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      - REDIS_ADDR=redis:6379
      - WORKER_COUNT=5
      - MAX_RETRIES=3
    depends_on:
      - redis
    command: ["go", "run", "./cmd/worker"]
